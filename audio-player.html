<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audio Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .audio__progress--bar {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 8px;
      background: linear-gradient(to right, #2bd97c 0%, #6d787d 0%);
      cursor: pointer;
      outline: none;
    }
    .audio__progress--bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #fff;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-end min-h-screen">

  <div class="w-full flex items-center justify-between bg-[#042330] px-10 h-20 fixed bottom-0 left-0 z-[9998] md:h-auto md:flex-col md:px-6 md:py-4 md:gap-4">

    <!-- Track Info -->
    <div class="flex items-center gap-3 w-1/3 md:w-full md:justify-center">
      <figure class="flex-shrink-0 w-12 h-12">
        <img
          class="w-full h-full object-cover rounded"
          src="https://firebasestorage.googleapis.com/v0/b/summaristt.appspot.com/o/books%2Fimages%2Fhow-to-win-friends-and-influence-people.png?alt=media&token=099193aa-4d85-4e22-8eb7-55f12a235fe2"
          alt="book"
        />
      </figure>
      <div class="flex flex-col gap-1">
        <div class="text-white text-sm font-medium leading-tight">How to Win Friends and Influence People in the Digital Age</div>
        <div class="text-[#bac8ce] text-xs">Dale Carnegie</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-center gap-6 w-1/3 md:w-full md:justify-center">
      <!-- Rewind -->
      <button class="flex items-center justify-center cursor-pointer">
        <svg class="w-7 h-7 stroke-white hover:stroke-[#2bd97c] transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3.11111111,7.55555556 C4.66955145,4.26701301 8.0700311,2 12,2 C17.5228475,2 22,6.4771525 22,12 C22,17.5228475 17.5228475,22 12,22 C6.4771525,22 2,17.5228475 2,12 M2,4 L2,8 L6,8 M9,16 L9,9 L7,9.53333333 M17,12 C17,10 15.9999999,8.5 14.5,8.5 C13.0000001,8.5 12,10 12,12 C12,14 13,15.5000001 14.5,15.5 C16,15.4999999 17,14 17,12 Z"/>
        </svg>
      </button>

      <!-- Play -->
      <button class="flex items-center justify-center w-10 h-10 bg-white rounded-full cursor-pointer hover:scale-105 transition-transform">
        <svg class="w-5 h-5 text-[#042330] ml-0.5" fill="currentColor" viewBox="0 0 512 512">
          <path d="M96 448l320-192L96 64v384z"/>
        </svg>
      </button>

      <!-- Forward -->
      <button class="flex items-center justify-center cursor-pointer">
        <svg class="w-7 h-7 stroke-white hover:stroke-[#2bd97c] transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20.8888889,7.55555556 C19.3304485,4.26701301 15.9299689,2 12,2 C6.4771525,2 2,6.4771525 2,12 C2,17.5228475 6.4771525,22 12,22 C17.5228475,22 22,17.5228475 22,12 M22,4 L22,8 L18,8 M9,16 L9,9 L7,9.53333333 M17,12 C17,10 15.9999999,8.5 14.5,8.5 C13.0000001,8.5 12,10 12,12 C12,14 13,15.5000001 14.5,15.5 C16,15.4999999 17,14 17,12 Z"/>
        </svg>
      </button>
    </div>

    <!-- Progress -->
    <div class="flex items-center gap-4 w-1/3 md:w-full md:justify-center">
      <span class="text-white text-sm min-w-[40px]">00:00</span>
      <input
        type="range"
        class="audio__progress--bar w-full max-w-[300px]"
        value="0"
        min="0"
        max="204.048"
      />
      <span class="text-white text-sm min-w-[40px]">03:24</span>
    </div>

  </div>

</body>
</html>
